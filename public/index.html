<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AMP REM - Auto Reaction Wa</title>
    <style>
        :root {
            --bg-dark: #0f1115;
            --bg-card: #181b20;
            --bg-input: #21252d;
            --border-color: #2a2e37;
            --text-main: #e6e8ec;
            --text-muted: #8b92a0;
            --accent-glow: #3b82f6;
            --accent-btn: #2563eb;
            --accent-btn-hover: #1d4ed8;
            --success: #10b981;
            --error: #ef4444;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 500px;
            background-color: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 28px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
        }

        .header {
            text-align: center;
            margin-bottom: 24px;
        }

        .header h1 {
            font-size: 22px;
            font-weight: 700;
            letter-spacing: 1px;
            color: #ffffff;
            margin-bottom: 6px;
            text-transform: uppercase;
        }

        .header h1 span {
            color: var(--accent-glow);
        }

        .header p {
            font-size: 13px;
            color: var(--text-muted);
        }

        .form-group {
            margin-bottom: 18px;
        }

        .form-group label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            margin-bottom: 8px;
            color: var(--text-main);
        }

        .form-control {
            width: 100%;
            padding: 12px 14px;
            background-color: var(--bg-input);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            color: #ffffff;
            font-size: 14px;
            outline: none;
            transition: border-color 0.2s;
        }

        .form-control:focus {
            border-color: var(--accent-glow);
        }

        .btn-submit {
            width: 100%;
            padding: 12px;
            background-color: var(--accent-btn);
            color: #ffffff;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s;
            margin-top: 8px;
        }

        .btn-submit:hover {
            background-color: var(--accent-btn-hover);
        }

        .btn-submit:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .result-box {
            margin-top: 20px;
            padding: 14px;
            background-color: var(--bg-input);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            font-size: 13px;
            display: none;
            word-break: break-all;
        }

        .result-box.success {
            border-color: var(--success);
            color: #34d399;
        }

        .result-box.error {
            border-color: var(--error);
            color: #f87171;
        }

        .footer {
            margin-top: 24px;
            text-align: center;
            font-size: 12px;
            color: var(--text-muted);
            border-top: 1px solid var(--border-color);
            padding-top: 16px;
        }

        .footer strong {
            color: var(--text-main);
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="header">
            <h1>AMP REM <span>AUTO REACTION WA</span></h1>
            <p>Kirim reaksi emoji otomatis ke Saluran WhatsApp</p>
        </div>

        <form id="reactionForm">
            <div class="form-group">
                <label for="postUrl">URL Postingan Saluran WA</label>
                <input type="url" id="postUrl" class="form-control" placeholder="https://whatsapp.com/channel/0029Vb82nkLEwEjtLSQ49I44/563" required>
            </div>

            <div class="form-group">
                <label for="emojis">Emoji Reaksi (Pisahkan dengan koma)</label>
                <input type="text" id="emojis" class="form-control" placeholder="🎉, 😉, 👍" value="🎉, 😉" required>
            </div>

            <button type="submit" id="submitBtn" class="btn-submit">Kirim Reaksi</button>
        </form>

        <div id="resultBox" class="result-box"></div>

        <div class="footer">
            Credits by <strong>Morgan</strong>
        </div>
    </div>

    <script>
        document.getElementById('reactionForm').addEventListener('submit', async function(e) {
            e.preventDefault();

            const postUrl = document.getElementById('postUrl').value.trim();
            const emojisInput = document.getElementById('emojis').value.trim();
            const submitBtn = document.getElementById('submitBtn');
            const resultBox = document.getElementById('resultBox');

            if (!postUrl || !emojisInput) return;

            submitBtn.disabled = true;
            submitBtn.innerText = 'Memproses...';
            resultBox.style.display = 'none';
            resultBox.className = 'result-box';

            try {
                const response = await fetch('/api/send-reaction', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        postUrl: postUrl,
                        emojis: emojisInput
                    })
                });

                const data = await response.json();

                resultBox.style.display = 'block';
                if (data.success) {
                    resultBox.classList.add('success');
                    resultBox.innerHTML = `<strong>Berhasil!</strong><br>${data.message}<br><small>Post ID: ${data.postId} | Emoji: ${data.emojisSent.join(' ')}</small>`;
                } else {
                    resultBox.classList.add('error');
                    resultBox.innerHTML = `<strong>Gagal:</strong> ${data.error || 'Terjadi kesalahan'}`;
                }

            } catch (err) {
                resultBox.style.display = 'block';
                resultBox.classList.add('error');
                resultBox.innerHTML = `<strong>Error:</strong> ${err.message || 'Gagal terhubung ke server API Vercel.'}`;
            } finally {
                submitBtn.disabled = false;
                submitBtn.innerText = 'Kirim Reaksi';
            }
        });
    </script>
</body>
</html>
