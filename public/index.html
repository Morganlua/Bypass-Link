<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BypassLink - Multi Shortlink Bypasser</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    body { font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen pb-12">

  <!-- Header -->
  <header class="max-w-xl mx-auto px-4 pt-6 flex justify-between items-center">
    <div class="flex items-center gap-2">
      <div class="bg-blue-600 text-white p-2 rounded-xl font-extrabold text-xl flex items-center justify-center w-10 h-10 shadow-md shadow-blue-200">
        <i class="fa-solid fa-link-slash"></i>
      </div>
      <div>
        <span class="font-extrabold text-xl text-slate-900 tracking-tight">Bypass</span><span class="text-blue-600 font-extrabold text-xl">Link</span>
      </div>
    </div>
    <div class="bg-blue-50 text-blue-700 text-xs px-3.5 py-1.5 rounded-full font-bold flex items-center gap-1.5 border border-blue-200 shadow-xs">
      ✨ Credits Morgan
    </div>
  </header>

  <!-- Title Banner -->
  <section class="max-w-xl mx-auto text-center px-4 mt-8">
    <h1 class="text-3xl font-black text-slate-900 tracking-tight">BypassLink</h1>
    <p class="text-slate-500 text-sm mt-1.5 font-medium">Bypass Khaddavi, BicoLink, Sub2Unlock, Move2Link & Safelink Lainnya</p>
  </section>

  <main class="max-w-xl mx-auto px-4 mt-6 space-y-5">

    <!-- Card Input Utama -->
    <div class="bg-white rounded-2xl p-5 border border-slate-200 shadow-sm space-y-4">
      <div>
        <label class="text-xs font-bold text-slate-700 block mb-1">Tautan Shortlink / Safelink</label>
        <input type="url" id="shortUrl" placeholder="https://app.khaddavi.net/?an=... atau https://bicolink.net/..." class="w-full bg-slate-50 border border-slate-200 rounded-xl p-3 text-xs font-mono focus:outline-none focus:border-blue-500">
      </div>

      <button id="btnBypass" onclick="processBypass()" class="w-full bg-blue-600 text-white font-bold py-3.5 px-4 rounded-xl flex items-center justify-center gap-2 hover:bg-blue-700 transition active:scale-[0.99] shadow-md shadow-blue-200 text-sm">
        <i class="fa-solid fa-bolt"></i> Bypass Link Sekarang
      </button>

      <!-- Loading State -->
      <div id="loadingBox" class="hidden text-center py-6 space-y-3 bg-slate-50 rounded-xl border border-slate-200">
        <div class="inline-block animate-spin text-blue-600 text-2xl">
          <i class="fa-solid fa-circle-notch"></i>
        </div>
        <p class="text-xs font-bold text-slate-700">Mengekstrak tautan tujuan asli...</p>
      </div>

      <!-- Result Card -->
      <div id="resultCard" class="hidden bg-slate-50 rounded-xl p-4 border border-blue-200 space-y-3">
        <div class="flex items-center justify-between">
          <span class="text-xs font-bold text-emerald-600 flex items-center gap-1.5">
            <i class="fa-solid fa-circle-check"></i> BERHASIL DI-BYPASS
          </span>
          <span id="methodBadge" class="bg-blue-600 text-white text-[10px] font-bold px-2 py-0.5 rounded-full">DOM Extraction</span>
        </div>

        <div class="bg-white p-3 rounded-lg border border-slate-200 space-y-1">
          <span class="text-slate-400 block text-[10px] font-bold">LINK TUJUAN ASLI</span>
          <a id="resLink" href="#" target="_blank" class="font-bold text-blue-600 hover:underline text-xs font-mono break-all block">https://...</a>
        </div>

        <div class="flex gap-2">
          <button onclick="copyResultLink()" class="flex-1 bg-slate-900 text-white font-bold py-2.5 px-3 rounded-xl text-xs flex items-center justify-center gap-1.5 hover:bg-slate-800 transition">
            <i class="fa-regular fa-copy"></i> Salin Link
          </button>
          <a id="openResultBtn" href="#" target="_blank" class="flex-1 bg-blue-600 text-white font-bold py-2.5 px-3 rounded-xl text-xs flex items-center justify-center gap-1.5 hover:bg-blue-700 transition">
            <i class="fa-solid fa-arrow-up-right-from-square"></i> Buka Link
          </a>
        </div>
      </div>
    </div>

    <!-- Riwayat Bypass -->
    <div class="bg-white rounded-2xl p-4 border border-slate-200 shadow-sm space-y-3">
      <div class="flex items-center justify-between">
        <span class="font-bold text-xs text-slate-900 flex items-center gap-1.5">
          <i class="fa-solid fa-clock-rotate-left text-blue-600"></i> Riwayat Bypass
        </span>
        <button onclick="clearHistory()" class="text-[11px] text-red-500 hover:underline">Hapus Semua</button>
      </div>
      <div id="historyList" class="space-y-2">
        <p class="text-slate-400 text-[11px] italic">Belum ada riwayat bypass.</p>
      </div>
    </div>

  </main>

  <script>
    let bypassHistory = [];

    function init() {
      const saved = localStorage.getItem('bypasslink_history');
      if (saved) {
        try { bypassHistory = JSON.parse(saved); } catch(e) {}
      }
      renderHistory();
    }

    async function processBypass() {
      const urlInput = document.getElementById('shortUrl').value.trim();
      const btn = document.getElementById('btnBypass');
      const loadingBox = document.getElementById('loadingBox');
      const resultCard = document.getElementById('resultCard');

      if (!urlInput) {
        alert('Masukkan URL shortlink terlebih dahulu!');
        return;
      }

      btn.disabled = true;
      btn.classList.add('opacity-50');
      loadingBox.classList.remove('hidden');
      resultCard.classList.add('hidden');

      try {
        const res = await fetch('/api/bypass', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ url: urlInput })
        });

        const json = await res.json();

        if (json && json.status && json.data) {
          const dest = json.data.destination_url;
          document.getElementById('resLink').innerText = dest;
          document.getElementById('resLink').href = dest;
          document.getElementById('openResultBtn').href = dest;
          document.getElementById('methodBadge').innerText = json.data.method || 'Bypass Engine';

          resultCard.classList.remove('hidden');

          bypassHistory.unshift({
            original: urlInput,
            destination: dest,
            date: new Date().toLocaleTimeString()
          });
          if (bypassHistory.length > 5) bypassHistory.pop();
          localStorage.setItem('bypasslink_history', JSON.stringify(bypassHistory));
          renderHistory();
        } else {
          alert('Gagal: ' + (json.error || 'Link tujuan tidak ditemukan'));
        }
      } catch (e) {
        alert('Gagal memproses koneksi ke server bypass');
      } finally {
        btn.disabled = false;
        btn.classList.remove('opacity-50');
        loadingBox.classList.add('hidden');
      }
    }

    function renderHistory() {
      const el = document.getElementById('historyList');
      if (!bypassHistory.length) {
        el.innerHTML = `<p class="text-slate-400 text-[11px] italic">Belum ada riwayat bypass.</p>`;
        return;
      }

      el.innerHTML = bypassHistory.map(item => `
        <div class="p-2.5 bg-slate-50 border border-slate-200 rounded-xl flex justify-between items-center text-xs">
          <div class="truncate mr-2">
            <span class="font-bold text-slate-800 font-mono block truncate">${item.destination}</span>
            <span class="text-slate-400 text-[10px] block truncate">Asal: ${item.original}</span>
          </div>
          <a href="${item.destination}" target="_blank" class="text-blue-600 text-[11px] hover:underline font-bold shrink-0">Buka</a>
        </div>
      `).join('');
    }

    function clearHistory() {
      bypassHistory = [];
      localStorage.removeItem('bypasslink_history');
      renderHistory();
    }

    function copyResultLink() {
      const link = document.getElementById('resLink').innerText;
      navigator.clipboard.writeText(link);
      alert('Berhasil disalin: ' + link);
    }

    window.onload = init;
  </script>
</body>
</html>
